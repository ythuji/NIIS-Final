# ==============================================================================
# NIDIS - National Identity Document Issuing System Configuration
# ==============================================================================

spring.application.name=National_Identity_Document_Issuing_System
server.port=8080

# ------------------------------------------------------------------------------
# MS SQL Server DataSource Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NIDIS_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrong@Password123

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ------------------------------------------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# File Upload Configuration (Document attachments: NIC/Passport/License)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ------------------------------------------------------------------------------
# Mail Service Configuration (Mock / SMTP for OTP & Notifications)
# ------------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------------------
# Spring Session JDBC Configuration
# ------------------------------------------------------------------------------
spring.session.store-type=none
spring.session.jdbc.initialize-schema=embedded
